[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stt-gijirepo"
version = "1.0.0"
description = "STT議事録システム - LangGraphベースの音声・動画ファイルから議事録を自動生成するシステム"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "STT Team", email = "team@example.com"}
]
maintainers = [
    {name = "STT Team", email = "team@example.com"}
]
keywords = [
    "stt",
    "speech-to-text",
    "meeting-minutes",
    "langgraph",
    "gemini",
    "notion",
    "audio-processing",
    "video-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.8"
dependencies = [
    "requests>=2.28.0",
    "pydub>=0.25.1",
    "numpy>=1.21.0",
    "protobuf>=4.21.0",
    "google-genai>=0.3.0",
    "opencv-python>=4.5.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
    "notion-client>=2.0.0",
    "tenacity>=8.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.8.0",
    "ffmpeg-python>=0.2.0",
    "typing-extensions>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "flake8>=5.0.0",
]
test = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
lint = [
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
    "flake8>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/your-org/stt-gijirepo"
Documentation = "https://github.com/your-org/stt-gijirepo/blob/main/README.md"
Repository = "https://github.com/your-org/stt-gijirepo"
Issues = "https://github.com/your-org/stt-gijirepo/issues"

[project.scripts]
stt-gijirepo = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
exclude = ["tests*", "docs*"]

[tool.setuptools.package-data]
"src.prompts" = ["*.md", "*.txt"]
"src.scripts" = ["*.py"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310', 'py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
  | old_src
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
skip_glob = ["old_src/*"]

# MyPy configuration
[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
exclude = [
    "old_src/",
    "build/",
    "dist/",
]

[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "pydub.*",
    "notion_client.*",
    "google.genai.*",
    "langgraph.*",
    "langchain_core.*",
    "ffmpeg.*",
]
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=src",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]
testpaths = ["src/tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["src"]
omit = [
    "src/tests/*",
    "*/test_*.py",
    "old_src/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

# Flake8 configuration (in setup.cfg format for compatibility)
[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503", "E501"]
exclude = [
    ".git",
    "__pycache__",
    "old_src",
    "build",
    "dist",
    ".venv",
    ".tox",
    "*.egg-info",
]
per-file-ignores = [
    "__init__.py:F401",
    "src/tests/*:S101",
]