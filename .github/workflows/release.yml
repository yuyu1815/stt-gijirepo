# STT議事録システム リリースワークフロー
# 自動リリース・パッケージング・デプロイメント

name: Release

on:
  push:
    tags:
      - 'v*.*.*'  # v1.0.0, v2.1.3 などのタグでトリガー
  workflow_dispatch:
    inputs:
      version:
        description: 'リリースバージョン (例: v1.0.0)'
        required: true
        type: string

env:
  PYTHON_VERSION: '3.8'

jobs:
  # =============================================================================
  # リリース前検証
  # =============================================================================
  pre-release-validation:
    name: リリース前検証
    runs-on: ubuntu-latest
    
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      tag: ${{ steps.get-version.outputs.tag }}
    
    steps:
    - name: チェックアウト
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: バージョン情報取得
      id: get-version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION=${GITHUB_REF#refs/tags/}
        fi
        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "tag=${VERSION}" >> $GITHUB_OUTPUT
        echo "リリースバージョン: ${VERSION}"
        
    - name: Python環境セットアップ
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: 依存関係インストール
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest black isort flake8 mypy
        
    - name: 品質チェック実行
      run: |
        echo "コード品質チェックを実行中..."
        black --check src/
        isort --check-only src/
        flake8 src/ --max-line-length=88 --extend-ignore=E203,W503,E501
        mypy src/ --ignore-missing-imports
        
    - name: テスト実行
      run: |
        echo "全テストを実行中..."
        pytest src/tests/ -v --tb=short
        
    - name: バージョン整合性チェック
      run: |
        echo "バージョン整合性をチェック中..."
        # pyproject.tomlのバージョンとタグの整合性をチェック
        if [ -f pyproject.toml ]; then
          PYPROJECT_VERSION=$(grep -E '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          TAG_VERSION=${{ steps.get-version.outputs.version }}
          if [ "v${PYPROJECT_VERSION}" != "${TAG_VERSION}" ]; then
            echo "❌ バージョン不整合: pyproject.toml(${PYPROJECT_VERSION}) != tag(${TAG_VERSION})"
            exit 1
          fi
          echo "✅ バージョン整合性OK: ${TAG_VERSION}"
        fi

  # =============================================================================
  # パッケージビルド
  # =============================================================================
  build-package:
    name: パッケージビルド
    runs-on: ubuntu-latest
    needs: pre-release-validation
    
    steps:
    - name: チェックアウト
      uses: actions/checkout@v4
      
    - name: Python環境セットアップ
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: ビルドツールインストール
      run: |
        python -m pip install --upgrade pip
        pip install build twine wheel
        
    - name: パッケージビルド
      run: |
        echo "パッケージをビルド中..."
        python -m build
        
    - name: パッケージ検証
      run: |
        echo "ビルドされたパッケージを検証中..."
        twine check dist/*
        
    - name: ビルド成果物アップロード
      uses: actions/upload-artifact@v3
      with:
        name: python-package-distributions
        path: dist/

  # =============================================================================
  # Docker イメージビルド
  # =============================================================================
  build-docker:
    name: Docker イメージビルド
    runs-on: ubuntu-latest
    needs: pre-release-validation
    
    steps:
    - name: チェックアウト
      uses: actions/checkout@v4
      
    - name: Docker Buildx セットアップ
      uses: docker/setup-buildx-action@v3
      
    - name: Docker Hub ログイン
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
      if: github.event_name != 'workflow_dispatch'
      
    - name: メタデータ抽出
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: stt-gijirepo/stt-system
        tags: |
          type=ref,event=tag
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=semver,pattern={{major}}
          
    - name: Docker イメージビルド・プッシュ
      uses: docker/build-push-action@v5
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name != 'workflow_dispatch' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # =============================================================================
  # GitHub リリース作成
  # =============================================================================
  create-release:
    name: GitHub リリース作成
    runs-on: ubuntu-latest
    needs: [pre-release-validation, build-package, build-docker]
    
    steps:
    - name: チェックアウト
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        
    - name: ビルド成果物ダウンロード
      uses: actions/download-artifact@v3
      with:
        name: python-package-distributions
        path: dist/
        
    - name: リリースノート生成
      id: release-notes
      run: |
        VERSION=${{ needs.pre-release-validation.outputs.version }}
        echo "リリースノートを生成中..."
        
        # 前回のタグを取得
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
        
        # リリースノートを生成
        cat > release_notes.md << EOF
        # STT議事録システム ${VERSION}
        
        ## 🚀 新機能・改善
        
        $(if [ -n "$PREVIOUS_TAG" ]; then
          git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s" --grep="feat\|add\|new" | head -10
        else
          echo "- 初回リリース"
        fi)
        
        ## 🐛 バグ修正
        
        $(if [ -n "$PREVIOUS_TAG" ]; then
          git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s" --grep="fix\|bug" | head -10
        else
          echo "- なし"
        fi)
        
        ## 📝 変更履歴
        
        $(if [ -n "$PREVIOUS_TAG" ]; then
          git log ${PREVIOUS_TAG}..HEAD --pretty=format:"- %s (%an)" | head -20
        else
          echo "- 初回リリース"
        fi)
        
        ## 📦 インストール方法
        
        ### pip でのインストール
        \`\`\`bash
        pip install stt-gijirepo==${VERSION#v}
        \`\`\`
        
        ### Docker でのインストール
        \`\`\`bash
        docker pull stt-gijirepo/stt-system:${VERSION}
        \`\`\`
        
        ### ソースからのインストール
        \`\`\`bash
        git clone https://github.com/your-org/stt-gijirepo.git
        cd stt-gijirepo
        git checkout ${VERSION}
        pip install -r requirements.txt
        \`\`\`
        
        ## 🔧 システム要件
        
        - Python 3.8以上
        - FFmpeg (音声・動画処理用)
        - 2GB以上のRAM
        - 10GB以上の空きディスク容量
        
        ## 📚 ドキュメント
        
        - [ユーザーガイド](docs/user_guide/)
        - [API リファレンス](docs/api/)
        - [開発者ガイド](docs/developer_guide/)
        
        ---
        
        **完全な変更履歴**: $(if [ -n "$PREVIOUS_TAG" ]; then echo "${PREVIOUS_TAG}...${VERSION}"; else echo "初回リリース"; fi)
        EOF
        
        echo "release_notes_file=release_notes.md" >> $GITHUB_OUTPUT
        
    - name: GitHub リリース作成
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ needs.pre-release-validation.outputs.tag }}
        name: STT議事録システム ${{ needs.pre-release-validation.outputs.version }}
        body_path: release_notes.md
        files: |
          dist/*
        draft: false
        prerelease: ${{ contains(needs.pre-release-validation.outputs.version, 'alpha') || contains(needs.pre-release-validation.outputs.version, 'beta') || contains(needs.pre-release-validation.outputs.version, 'rc') }}
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # =============================================================================
  # PyPI パッケージ公開
  # =============================================================================
  publish-pypi:
    name: PyPI パッケージ公開
    runs-on: ubuntu-latest
    needs: [create-release]
    if: github.event_name != 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/p/stt-gijirepo
    
    permissions:
      id-token: write  # OIDC for PyPI trusted publishing
    
    steps:
    - name: ビルド成果物ダウンロード
      uses: actions/download-artifact@v3
      with:
        name: python-package-distributions
        path: dist/
        
    - name: PyPI に公開
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true

  # =============================================================================
  # デプロイメント通知
  # =============================================================================
  notify-deployment:
    name: デプロイメント通知
    runs-on: ubuntu-latest
    needs: [create-release, publish-pypi]
    if: always()
    
    steps:
    - name: 成功通知
      if: needs.create-release.result == 'success'
      run: |
        echo "🎉 リリース成功!"
        echo "バージョン: ${{ needs.pre-release-validation.outputs.version }}"
        echo "GitHub リリース: ✅"
        echo "PyPI 公開: ${{ needs.publish-pypi.result == 'success' && '✅' || '❌' }}"
        
    - name: 失敗通知
      if: needs.create-release.result == 'failure'
      run: |
        echo "❌ リリースに失敗しました"
        echo "GitHub リリース: ${{ needs.create-release.result }}"
        echo "PyPI 公開: ${{ needs.publish-pypi.result }}"
        exit 1

  # =============================================================================
  # リリース後処理
  # =============================================================================
  post-release:
    name: リリース後処理
    runs-on: ubuntu-latest
    needs: [create-release]
    if: needs.create-release.result == 'success'
    
    steps:
    - name: チェックアウト
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: 次期開発バージョン準備
      run: |
        VERSION=${{ needs.pre-release-validation.outputs.version }}
        echo "次期開発バージョンの準備..."
        
        # バージョン番号を増加
        CURRENT_VERSION=${VERSION#v}
        IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
        MAJOR=${VERSION_PARTS[0]}
        MINOR=${VERSION_PARTS[1]}
        PATCH=${VERSION_PARTS[2]}
        
        # パッチバージョンを増加
        NEXT_PATCH=$((PATCH + 1))
        NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-dev"
        
        echo "次期バージョン: ${NEXT_VERSION}"
        
        # pyproject.toml を更新 (存在する場合)
        if [ -f pyproject.toml ]; then
          sed -i "s/version = \".*\"/version = \"${NEXT_VERSION}\"/" pyproject.toml
          git add pyproject.toml
        fi
        
        # コミット・プッシュ
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git commit -m "chore: bump version to ${NEXT_VERSION} for development" || echo "変更なし"
        git push origin main || echo "プッシュ不要"